[package]
name = "ai-relay"
version = "2026.10.18"
edition = "2024"
license = "MIT"
publish = false
description = "AI Relay: Windows-native AI provider traffic proxy with a Win32 GUI"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
url = "2"
ipnet = { version = "2", features = ["serde"] }
serde_json = "1"
rusqlite = { version = "0.38", features = ["bundled"] }
hmac = "0.12"
sha2 = "0.10"
getrandom = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "server", "http1", "tokio"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "native-tokio", "ring", "tls12"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_System_Com", "Win32_UI_Shell", "Win32_Foundation", "Win32_System_Com_StructuredStorage", "Win32_Storage_FileSystem"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_Com", "Win32_System_Memory", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_IO", "Win32_System_RemoteDesktop", "Win32_Security_Authorization", "Win32_UI_Controls", "Win32_Graphics_Dwm", "Win32_System_Registry", "Win32_Security_Cryptography", "Win32_UI_Shell_Common", "Win32_System_Console"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
